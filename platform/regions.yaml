# Region -> GPU platform table consumed by the Terraform roots (yamldecode) and
# rendered into docs/compatibility-matrix.md. One place to add a region or a GPU.
#
# Sources (verified 2026-10-09):
#   fabrics ............ https://docs.nebius.com/compute/clusters/gpu  (one fabric accepts one platform)
#   driver presets ..... https://docs.nebius.com/kubernetes/gpu/set-up (cuda13.0 = 580.x, every platform; cuda12.8 = 570.x, opt-in only)
#   B200 drivers ....... https://docs.nebius.com/compute/storage/boot-disk-images#images-for-gpu-vms (B200 1-GPU preset needs 580.x)
#   presets ............ https://docs.nebius.com/compute/virtual-machines/types (1-GPU and 8-GPU presets per platform;
#                        the 8-GPU H100/H200/B200/B300 presets are the GPU-cluster-compatible ones, L40S has none)
#   regions/services ... https://docs.nebius.com/overview/regions (verified 2026-10-11)
#   object storage ..... https://docs.nebius.com/object-storage/storage-classes (verified 2026-10-11)
#   cross-check ........ nebius-solutions-library k8s-training/locals.tf @ soperator-v4.1.13-2 (regions_default);
#                        gpu-b300-sxm/1gpu-24vcpu-346gb also observed live 2026-10-08 (docs/evidence/raw/2026-10-08-mk8s-b300)
#
# `operator_driver_version` is the GPU Operator driver the docs require on that platform when the
# operator path is used (B300: 580.95.05); absent = chart default.
# `default` names the platform a root picks when gpu_platform is null. `fabric` is the default
# InfiniBand fabric for that platform in that region; platforms without one cannot form a GPU cluster.
# `object_storage_classes` lists the Object Storage classes the region offers; the first is the
# default a data root picks. Absent = STANDARD, ENHANCED_THROUGHPUT and INTELLIGENT are all offered.
# `spot_price_cap: true` marks the (platform, region) pairs a billing pricing policy (R9 spot cap)
# accepts. Source: the API's own list in the error for gpu-l40s-a in eu-north1 on 2026-10-11 (H100 in
# eu-north1; H200 in eu-north1, eu-north2, eu-west1, us-central1); the docs do not list them.
#
# Platforms deliberately NOT modelled here (the stacks only build Managed Kubernetes node groups):
#   gpu-gb300 ........ NVIDIA GB300 NVL72 with Grace (preset 4gpu-112vcpu-800gb), seen in eu-north1 by a
#                      read-only compute/v1/platforms listing on 2026-10-11. Rack-scale NVL72 is ordered as
#                      an NVLink instance group (nebius_compute_v1_nvl_instance_group, type GB300:
#                      https://docs.nebius.com/terraform-provider/reference/resources/compute_v1_nvl_instance_group),
#                      not as an MK8s node group, and the VM types and regions pages do not list it
#                      (docs/solutions/gaps-and-discrepancies.md). Its own recipe is R15
#                      (terraform/stacks/nvl), which fixes platform and preset itself.

regions:
  eu-north1:
    default: gpu-h100-sxm
    platforms:
      gpu-h100-sxm: { single_gpu_preset: "1gpu-16vcpu-200gb", ib_preset: "8gpu-128vcpu-1600gb", drivers_preset: "cuda13.0", fabric: "fabric-3", fabrics: ["fabric-2", "fabric-3", "fabric-4", "fabric-6"], spot_price_cap: true }
      gpu-h200-sxm: { single_gpu_preset: "1gpu-16vcpu-200gb", ib_preset: "8gpu-128vcpu-1600gb", drivers_preset: "cuda13.0", fabric: "fabric-7", fabrics: ["fabric-7"], spot_price_cap: true }
      gpu-l40s-a:   { single_gpu_preset: "1gpu-8vcpu-32gb", drivers_preset: "cuda13.0" }
      gpu-l40s-d:   { single_gpu_preset: "1gpu-16vcpu-96gb", drivers_preset: "cuda13.0" }
  eu-north2:
    note: "private region: Managed Kubernetes cluster quota is 0 by default (docs/kubernetes/resources/quotas-limits); request quota first"
    default: gpu-h200-sxm
    platforms:
      gpu-h200-sxm: { single_gpu_preset: "1gpu-16vcpu-200gb", ib_preset: "8gpu-128vcpu-1600gb", drivers_preset: "cuda13.0", fabric: "eu-north2-a", fabrics: ["eu-north2-a"], spot_price_cap: true }
  eu-west1:
    default: gpu-h200-sxm
    platforms:
      gpu-h200-sxm: { single_gpu_preset: "1gpu-16vcpu-200gb", ib_preset: "8gpu-128vcpu-1600gb", drivers_preset: "cuda13.0", fabric: "fabric-5", fabrics: ["fabric-5"], spot_price_cap: true }
  eu-west2:
    default: gpu-b300-sxm
    object_storage_classes: [ENHANCED_THROUGHPUT] # no STANDARD/INTELLIGENT here
    platforms:
      gpu-b300-sxm: { single_gpu_preset: "1gpu-24vcpu-346gb", ib_preset: "8gpu-192vcpu-2768gb", drivers_preset: "cuda13.0", operator_driver_version: "580.95.05", fabric: "eu-west2-a", fabrics: ["eu-west2-a"] }
  uk-south1:
    default: gpu-b300-sxm
    object_storage_classes: [ENHANCED_THROUGHPUT] # no STANDARD/INTELLIGENT here
    platforms:
      gpu-b300-sxm: { single_gpu_preset: "1gpu-24vcpu-346gb", ib_preset: "8gpu-192vcpu-2768gb", drivers_preset: "cuda13.0", operator_driver_version: "580.95.05", fabric: "uk-south1-a", fabrics: ["uk-south1-a"] }
  us-north1:
    default: gpu-b300-sxm
    object_storage_classes: [ENHANCED_THROUGHPUT] # no STANDARD/INTELLIGENT here
    platforms:
      gpu-b300-sxm: { single_gpu_preset: "1gpu-24vcpu-346gb", ib_preset: "8gpu-192vcpu-2768gb", drivers_preset: "cuda13.0", operator_driver_version: "580.95.05", fabric: "us-north1-a", fabrics: ["us-north1-a"] }
  us-central1:
    note: "default GPU quota is 0 for H200, B200 and RTX PRO 6000 without a capacity reservation; request quota first"
    default: gpu-h200-sxm
    platforms:
      gpu-h200-sxm: { single_gpu_preset: "1gpu-16vcpu-200gb", ib_preset: "8gpu-128vcpu-1600gb", drivers_preset: "cuda13.0", fabric: "us-central1-a", fabrics: ["us-central1-a"], spot_price_cap: true }
      gpu-b200-sxm: { single_gpu_preset: "1gpu-20vcpu-224gb", ib_preset: "8gpu-160vcpu-1792gb", drivers_preset: "cuda13.0", fabric: "us-central1-b", fabrics: ["us-central1-b"] }
      gpu-rtx6000:  { single_gpu_preset: "1gpu-24vcpu-218gb", drivers_preset: "cuda13.0" }
  eu-south1:
    note: "Madrid; no InfiniBand fabric, Serverless AI, Managed MLflow or Managed PostgreSQL (overview/regions)"
    default: gpu-rtx6000-a
    object_storage_classes: [ENHANCED_THROUGHPUT] # no STANDARD/INTELLIGENT here
    platforms:
      gpu-rtx6000-a: { single_gpu_preset: "1gpu-24vcpu-218gb", drivers_preset: "cuda13.0" }
  uk-south2:
    note: "UK; no InfiniBand fabric, Managed MLflow or Managed PostgreSQL (overview/regions)"
    default: gpu-rtx6000-a
    object_storage_classes: [ENHANCED_THROUGHPUT] # no STANDARD/INTELLIGENT here
    platforms:
      gpu-rtx6000-a: { single_gpu_preset: "1gpu-24vcpu-218gb", drivers_preset: "cuda13.0" }
  me-west1:
    note: "Managed Kubernetes cluster quota is 0 by default (docs/kubernetes/resources/quotas-limits); request quota first"
    default: gpu-b200-sxm-a
    platforms:
      gpu-b200-sxm-a: { single_gpu_preset: "1gpu-20vcpu-224gb", ib_preset: "8gpu-160vcpu-1792gb", drivers_preset: "cuda13.0", fabric: "me-west1-a", fabrics: ["me-west1-a"] }

# Kubernetes control-plane versions Managed Kubernetes accepts for new clusters
# (https://docs.nebius.com/kubernetes/versions, verified 2026-10-09). 1.36 is the default;
# Soperator 4.1.13 supports 1.32-1.35 only (driver_presets.tf at soperator-v4.1.13-2).
kubernetes_versions: ["1.34", "1.35", "1.36"]
