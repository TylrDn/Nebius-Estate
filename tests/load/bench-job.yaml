# Load generator Job: tests/load/sweep.sh (vllm bench serve, concurrency sweep) from the pinned
# vLLM image. Rendered by tests/load/lib-bench.sh (05-load.sh for R1, recipes/serverless/endpoint.sh
# measure for R6 in-region); every placeholder is filled from the BENCH_* inputs (tests/load/README.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-bench
  namespace: __NAMESPACE__
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-bench # matched by allow-bench-egress and allow-bench-tokenizer-egress (workloads/inference/base/networkpolicy.yaml)
    spec:
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # >>> off-gpu: removed by lib-bench.sh when the cluster has no node without the GPU label
      # Keep the generator off the serving GPU node, so its CPU and network use never count against
      # the server being measured (the GPU node's taint only exists when a CPU group exists).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nip.nebius.io/gpu
                    operator: DoesNotExist
      # <<< off-gpu
      containers:
        - name: bench
          image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /root/.cache }
            - { name: sweep, mountPath: /bench, readOnly: true }
          command: ["/bin/sh", "/bench/sweep.sh"]
          env:
            - name: BASE_URL
              value: "__BASE_URL__"
            - name: MODEL
              value: "__MODEL__"
            - name: CONCURRENCY
              value: "__CONCURRENCY__"
            - name: NUM_PROMPTS
              value: "__NUM_PROMPTS__"
            - name: INPUT_LEN
              value: "__INPUT_LEN__"
            - name: OUTPUT_LEN
              value: "__OUTPUT_LEN__"
            - name: WARMUP_PROMPTS
              value: "__WARMUP_PROMPTS__"
            - name: OPENAI_API_KEY # only for a server with a key (R6 in-region); absent for R1
              valueFrom:
                secretKeyRef: { name: vllm-bench-key, key: OPENAI_API_KEY, optional: true }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits: { memory: 8Gi }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 2Gi } }
        - { name: cache, emptyDir: { sizeLimit: 2Gi } }
        - name: sweep
          configMap: { name: vllm-bench-sweep }
