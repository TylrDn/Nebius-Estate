<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e14" />
    <meta
      name="description"
      content="Nebius Estate: a self-hosted workspace for the Nebius infrastructure estate (built on Backstage)"
    />
    <link
      rel="manifest"
      href="<%= publicPath %>/manifest.json"
      crossorigin="use-credentials"
    />
    <link rel="icon" type="image/svg+xml" href="<%= publicPath %>/favicon.svg" />
    <title><%= config.getOptionalString('app.title') ?? 'Nebius Estate' %></title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
