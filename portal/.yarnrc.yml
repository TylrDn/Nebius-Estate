# Modified by Taylor Dean from Backstage create-app 0.9.2 (v1.55.0):
# Nebius Estate app/plugin configuration, backend composition and local verification.
# Source details and retained notices: docs/source-provenance.md, third_party/licenses/.
nodeLinker: node-modules
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@backstage/*'

yarnPath: .yarn/releases/yarn-4.13.0.cjs

# Developers run macOS (arm64); CI and the portal image run Linux (x64, glibc). Lock native packages
# (@swc/core, better-sqlite3 prebuilds, …) for both, or CI cannot load them.
supportedArchitectures:
  os: [current, darwin, linux]
  cpu: [current, arm64, x64]
  libc: [current, glibc]
