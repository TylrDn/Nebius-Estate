# Ingress isolation per team namespace, the same rule as workloads/components/ingress-isolation
# (that component carries no namespace, so it cannot serve two namespaces in one build): pods are
# reached from their own namespace (torchrun rendezvous, MPI workers) and from Prometheus in o11y.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-isolation
  namespace: team-nlp
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: o11y
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-isolation
  namespace: team-vision
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: o11y
