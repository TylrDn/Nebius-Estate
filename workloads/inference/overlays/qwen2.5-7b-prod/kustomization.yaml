# Prod shape of the 7B overlay: one replica per GPU node of the prod root (gpu_node_count = 2,
# terraform/live/prod/inference/prod.auto.tfvars). Rollouts replace one replica at a time, so one
# keeps serving; with no spare GPU there is no surge (maxSurge 0). Raise replicas with the node count.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../qwen2.5-7b
patches:
  - target: { kind: Deployment, name: vllm }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate: { maxUnavailable: 1, maxSurge: 0 }
  # Two replicas can keep one serving through a node drain (base/pdb.yaml).
  - target: { kind: PodDisruptionBudget, name: vllm }
    patch: |-
      - op: remove
        path: /spec/maxUnavailable
      - op: add
        path: /spec/minAvailable
        value: 1
