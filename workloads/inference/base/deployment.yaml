apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate # one GPU: the old pod must release it before the new one starts
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
      annotations:
        # Scraped by the chart's Prometheus (kubernetes-pods job): vLLM exposes /metrics on the
        # serving port. platform/alerts/inference.yaml alerts on these series.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      nodeSelector:
        nip.nebius.io/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      # The Service is named vllm, so Kubernetes service links would inject VLLM_PORT=tcp://<ip>:8000,
      # which vLLM reads as its own setting and refuses to start ("VLLM_PORT ... appears to be a URI";
      # docs.vllm.ai configuration/env_vars). Nothing here uses the legacy *_SERVICE_* variables.
      enableServiceLinks: false
      securityContext:
        # Root on purpose: the model cache is on the shared filesystem (csi-mounted-fs-path), whose docs
        # do not cover fsGroup, so a non-root UID may not be able to write it. Compensating controls:
        # no privilege escalation, all capabilities dropped, read-only root FS, NetworkPolicy.
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # writable paths are explicit emptyDirs below
            capabilities:
              drop: ["ALL"]
          args:
            - --model=$(MODEL)
            - --revision=$(MODEL_REVISION)
            - --served-model-name=$(MODEL)
            - --download-dir=/models
            - --host=0.0.0.0
            - --port=8000
            - --max-model-len=$(MAX_MODEL_LEN)
            - --gpu-memory-utilization=$(GPU_MEMORY_UTILIZATION)
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: HF_HOME
              value: /models/hf
            - name: HF_HUB_OFFLINE
              value: "0"
            # The root FS is read-only: point every cache and config home at the writable cache
            # emptyDir. Without these, vLLM 0.31's Triton/Inductor compile fails on /root/.triton
            # ("Read-only file system") and the engine never starts (2026-10-11 sandbox run).
            - name: TRITON_HOME
              value: /root/.cache
            - name: TRITON_CACHE_DIR
              value: /root/.cache/triton
            - name: VLLM_CONFIG_ROOT
              value: /root/.cache/vllm-config
            - name: XDG_CONFIG_HOME
              value: /root/.cache/config
            - name: VLLM_NO_USAGE_STATS # no telemetry to stats.vllm.ai (egress is denied anyway)
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
              nvidia.com/gpu: 1
            limits:
              memory: 48Gi
              nvidia.com/gpu: 1
          startupProbe: # model download + weight load; up to 15 min
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /root/.cache # vLLM/torch compile + triton caches
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        - name: cache
          emptyDir:
            sizeLimit: 8Gi
