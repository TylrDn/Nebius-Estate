# Smoke test on the inference lab's single-GPU node: proves image, drivers and the
# MPIJob plumbing within the small budget. Not a bandwidth measurement.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nccl-test
resources:
  - ../../base
patches:
  - target: { kind: MPIJob, name: nccl-test }
    patch: |-
      - op: replace
        path: /spec/slotsPerWorker
        value: 1
      - op: replace
        path: /spec/mpiReplicaSpecs/Worker/replicas
        value: 1
      - op: replace
        path: /spec/mpiReplicaSpecs/Worker/template/spec/containers/0/resources
        value:
          limits: { cpu: 8, memory: 100G, nvidia.com/gpu: 1 }
          requests: { cpu: 8, memory: 100G, nvidia.com/gpu: 1 }
      - op: replace
        path: /spec/mpiReplicaSpecs/Launcher/template/spec/containers/0/args/0
        value: >-
          mpirun -np 1 -bind-to none -x LD_LIBRARY_PATH -x NCCL_DEBUG=INFO
          /opt/nccl_tests/build/all_reduce_perf -b 8 -e 256M -f 2 -g 1
