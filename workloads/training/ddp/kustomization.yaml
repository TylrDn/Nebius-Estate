apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: training
resources:
  - namespace.yaml
  - pytorchjob.yaml
labels:
  # Object metadata only: selectors and pod templates stay as they are (Job templates are immutable).
  - pairs:
      app.kubernetes.io/part-of: nip-training
configMapGenerator:
  - name: ddp-script
    files:
      - train.py
generatorOptions:
  disableNameSuffixHash: true
components:
  - ../../components/ingress-isolation
